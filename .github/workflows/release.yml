name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 导入 Developer ID 证书到临时钥匙串
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: 构建并签名
        env:
          SIGN_IDENTITY: Developer ID Application
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: 公证并装订
        env:
          P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          P8="$RUNNER_TEMP/notary.p8"
          echo "$P8_BASE64" | base64 --decode > "$P8"
          ditto -c -k --keepParent build/OneClear.app "$RUNNER_TEMP/notarize.zip"
          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$P8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait --output-format json)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            xcrun notarytool log "$SUBMISSION_ID" --key "$P8" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            rm "$P8"
            exit 1
          fi
          rm "$P8"
          xcrun stapler staple build/OneClear.app

      - name: 打包并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="OneClear-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent build/OneClear.app "$ZIP"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "One Clear $GITHUB_REF_NAME" --generate-notes

      - name: 删除临时钥匙串
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
